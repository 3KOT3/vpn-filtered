name: Проверка VPN-конфигов (Россия)

# GitVerse CI/CD: синтаксис совместим с GitHub Actions.
# Запуск по расписанию (минимум 15 минут для облачных раннеров) и вручную.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

# Два прогона одновременно не нужны: они перезапишут друг друга.
concurrency:
  group: vpn-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Где мы находимся
        run: |
          echo "Откуда идёт проверка:"
          curl -fsS --max-time 20 https://ipinfo.io/json || true
          echo
          echo "Часовой пояс: $(date -u)"

      - name: Сообщить боту, откуда проверка
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          INFO=$(curl -fsS --max-time 20 https://ipinfo.io/json || echo '{}')
          curl -fsS --max-time 20 -X POST \
            -H "content-type: application/json" \
            --data "$INFO" \
            "https://moybot.sergeylllilllkin2.workers.dev/runner-info?key=${PUBLISH_KEY}" || true

      - name: Какие источники проверять
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          CONFIG=$(curl -fsS --max-time 20 "${WORKER_URL}/checker-sources?key=${PUBLISH_KEY}" || echo "")
          SOURCES=$(echo "$CONFIG" | python3 -c "import sys,json;print(','.join(json.load(sys.stdin).get('sources') or []))" 2>/dev/null || echo "")
          MBPS=$(echo "$CONFIG" | python3 -c "import sys,json;print(json.load(sys.stdin).get('min_mbps') or 2)" 2>/dev/null || echo 2)
          echo "$MBPS" > "$PWD/min_mbps.txt"
          echo "порог скорости из бота: $MBPS Мбит/с"
          if [ -z "$SOURCES" ]; then
            echo "не удалось получить список источников у бота — берём из конфига"
            rm -f "$PWD/sources.txt"
          else
            echo "источники из бота: $SOURCES"
            echo "$SOURCES" > "$PWD/sources.txt"
          fi

      - name: Установить sing-box
        run: |
          set -euo pipefail
          VERSION=1.14.3
          curl -fsSL --retry 3 -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Проверить конфиги
        run: |
          set -euo pipefail
          OUT="$PWD/out"
          mkdir -p "$OUT"
          python3 checker/check.py \
            --sing-box /usr/local/bin/sing-box \
            --out-dir "$OUT" \
            --work-dir /tmp/singbox \
            --cache-dir /tmp/sources \
            --min-mbps "$(cat "$PWD/min_mbps.txt" 2>/dev/null || echo 2)" \
            --confirm \
            --core-check \
            --min-keep 1 \
            --source-files "$(cat "$PWD/sources.txt" 2>/dev/null || echo 6,22,23)" \
            || echo "check.py вернул код $? — старый список не трогаем"
          echo "--- в списке ---"
          wc -l < "$OUT/1.txt" || true
          head -3 "$OUT/1.txt" || true

      - name: Опубликовать боту
        env:
          OUT_DIR: ${{ gitverse.workspace }}/out
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CHECKER_KEY: ${{ secrets.CHECKER_KEY }}
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          cd deploy/vm
          python3 publish.py
