name: Проверка VPN-конфигов (Россия)

# GitVerse CI/CD: синтаксис совместим с GitHub Actions.
# Запуск по расписанию (минимум 15 минут для облачных раннеров) и вручную.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

# Два прогона одновременно не нужны: они перезапишут друг друга.
concurrency:
  group: vpn-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Где мы находимся
        run: |
          echo "Откуда идёт проверка:"
          curl -fsS --max-time 20 https://ipinfo.io/json || true
          echo
          echo "Часовой пояс: $(date -u)"

      - name: Установить sing-box
        run: |
          set -euo pipefail
          VERSION=1.14.3
          curl -fsSL --retry 3 -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Проверить конфиги
        run: |
          set -euo pipefail
          OUT="$PWD/out"
          mkdir -p "$OUT"
          python3 checker/check.py \
            --sing-box /usr/local/bin/sing-box \
            --out-dir "$OUT" \
            --work-dir /tmp/singbox \
            --cache-dir /tmp/sources \
            --min-mbps 1.0 \
            --min-keep 1 \
            --source-files 6,22,23 || echo "check.py вернул код $? — старый список не трогаем"
          echo "--- в списке ---"
          wc -l < "$OUT/1.txt" || true
          head -3 "$OUT/1.txt" || true

      - name: Опубликовать боту
        env:
          OUT_DIR: ${{ gitverse.workspace }}/out
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CHECKER_KEY: ${{ secrets.CHECKER_KEY }}
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
        run: |
          cd deploy/vm
          python3 publish.py
